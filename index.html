<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IFCI Pension Voice Bot — Operations Console</title>
<link rel="icon" href="https://www.ifciltd.com/sites/default/files/ifci-logo_0_0.png" />
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500&family=Noto+Sans+Tamil:wght@400;500&family=Noto+Sans+Telugu:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --sidebar: #0b2545;
    --sidebar-hover: #133865;
    --sidebar-active: #1a4a82;
    --border: #e3e6ea;
    --ink: #131821;
    --ink-soft: #5b6472;
    --ink-faint: #8a93a2;
    --accent: #0f4c81;
    --accent-soft: #e6eef7;
    --gold: #c8932f;
    --gold-soft: #fbf3e0;
    --ok: #1f9d57;
    --warn: #c98a14;
    --bad: #d23f3f;
    --radius: 7px;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
    --shadow-md: 0 4px 16px rgba(16,24,40,.10);
    --font: 'Public Sans', -apple-system, system-ui, sans-serif;
  }
  html, body, #root { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }
  .font-deva { font-family: 'Noto Sans Devanagari', var(--font); }
  .font-beng { font-family: 'Noto Sans Bengali', var(--font); }
  .font-tam { font-family: 'Noto Sans Tamil', var(--font); }
  .font-tel { font-family: 'Noto Sans Telugu', var(--font); }

  .tabnum { font-variant-numeric: tabular-nums; }
  .scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: #cbd2db; border-radius: 4px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }

  /* phone frame */
  .phone {
    background: linear-gradient(180deg, #0b2545 0%, #133865 100%);
    border-radius: 36px;
    padding: 16px;
    box-shadow: 0 30px 60px -20px rgba(11,37,69,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .phone-screen {
    background: #f5f6f8;
    border-radius: 24px;
    overflow: hidden;
    position: relative;
  }
  .phone-notch {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 90px; height: 22px; background: #0b2545; border-radius: 16px;
    z-index: 10;
  }

  /* sound waves while bot speaks */
  @keyframes wave {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }
  .wave-bar { animation: wave 0.9s ease-in-out infinite; transform-origin: center; }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { animation-delay: 0.4s; }

  /* ring pulse */
  @keyframes pulse-ring {
    0% { transform: scale(.8); opacity: 0.8; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .pulse-ring { animation: pulse-ring 1.6s ease-out infinite; }

  /* fade-in for messages */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp .25s ease-out both; }

  /* typing dots */
  @keyframes dot { 0%,80%,100%{opacity:.2;transform:translateY(0)} 40%{opacity:1;transform:translateY(-2px)} }
  .typ { display:inline-block; width:5px;height:5px;border-radius:50%;background:#5b6472;margin:0 1px; animation: dot 1.2s infinite; }
  .typ:nth-child(2){ animation-delay:.15s }
  .typ:nth-child(3){ animation-delay:.3s }

  /* sidebar nav item */
  .nav-item { color: #b8c4d6; }
  .nav-item:hover { background: var(--sidebar-hover); color: #fff; }
  .nav-item.active {
    background: var(--sidebar-active);
    color: #fff;
    border-left: 3px solid var(--gold);
  }
  .nav-item.active .nav-icon { color: var(--gold); }

  /* stat cards / generic cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 500;
    line-height: 1.6;
  }
  .chip-dot { width: 6px; height: 6px; border-radius: 50%; }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #0d4373; }
  .btn-ghost { background: transparent; color: var(--ink-soft); }
  .btn-ghost:hover { background: var(--accent-soft); color: var(--accent); }

  .input {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: #fff;
    width: 100%;
    font: inherit;
  }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* Tricolor accent (subtle) for the IFCI/government feel */
  .tricolor {
    background: linear-gradient(90deg, #ff9933 0%, #ff9933 33.33%, #fff 33.33%, #fff 66.66%, #138808 66.66%, #138808 100%);
    height: 3px;
  }

  .glow-green { box-shadow: 0 0 0 4px rgba(31,157,87,0.15); }

  /* The watermark behind login */
  .login-art {
    background:
      radial-gradient(at 20% 20%, rgba(200,147,47,0.18) 0, transparent 50%),
      radial-gradient(at 80% 80%, rgba(15,76,129,0.5) 0, transparent 50%),
      linear-gradient(135deg, #0b2545 0%, #133865 100%);
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* =========================================================

const IFCI_LOGO = "https://www.ifciltd.com/sites/default/files/ifci-logo_0_0.png";
const DEMO_USER = {
  email: "operations@ifciltd.com",

  name: "Anita Mehra",
  role: "Ex-Employees Cell · Operations Lead",

const LANGS = [

/* small inline icons (lucide-style stroke=1.6) */
const Icon = ({ name, className = "w-4 h-4" }) => {
  const paths = {
    phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/>,
    headset: <><path d="M3 14v-3a9 9 0 1 1 18 0v3"/><path d="M21 14a2 2 0 0 1-2 2h-1v-5h1a2 2 0 0 1 2 2v1z"/><path d="M3 14a2 2 0 0 0 2 2h1v-5H5a2 2 0 0 0-2 2v1z"/></>,
    grid: <><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></>,
    chart: <><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/></>,
    users: <><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
    calendar: <><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></>,
    settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>,
    shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
    bell: <><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></>,
    list: <><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></>,
    file: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></>,
    plug: <><path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v5"/></>,
    log: <><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></>,
    play: <polygon points="5 3 19 12 5 21 5 3"/>,
    mic: <><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></>,
    check: <polyline points="20 6 9 17 4 12"/>,
    arrowRight: <><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>,
    arrowLeft: <><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>,
    x: <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
    lock: <><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
    info: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>,
    logout: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>,
    refresh: <><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>,
    rupee: <><path d="M6 3h12M6 8h12M6 13l9 8"/><path d="M6 13c5 0 9-2 9-5"/></>,
    bot: <><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></>,
    transfer: <><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></>,

/* =========================================================
 * SHARED HELPERS
 * ========================================================= */
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const pad = (n, w=2) => String(n).padStart(w, "0");
const inr = (n) => new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 0 }).format(n);
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };

/* =========================================================
 * LOGIN
 * ========================================================= */
function Login({ onAuth }) {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [showPw, setShowPw] = useState(false);

  const submit = (e) => {
    e && e.preventDefault();
    // Tolerant compare: trim whitespace, case-insensitive email, exact password (trim only)
    const cleanEmail = (email || "").trim().toLowerCase();
    const cleanPw = (pw || "").trim();
    if (cleanEmail === DEMO_USER.email.toLowerCase() && cleanPw === DEMO_USER.password) {
      onAuth(DEMO_USER);
    } else if (!cleanEmail || !cleanPw) {
      setErr("Please enter both email and password, or click 'Sign in as demo user' below.");
    } else {
      setErr("Credentials did not match. Click 'Sign in as demo user' below to skip the form.");
    }
  };

  const autofill = () => {
    setEmail(DEMO_USER.email);
    setPw(DEMO_USER.password);
    setErr("");
  };

  const signInDirect = () => onAuth(DEMO_USER);

  return (
    <div className="min-h-screen grid grid-cols-1 lg:grid-cols-5">
      {/* Left branded panel */}
      <div className="login-art lg:col-span-3 text-white p-10 lg:p-16 flex flex-col justify-between">
        <div>
          <div className="flex items-center gap-3">
            <div className="bg-white rounded-md p-2">
              <img src={IFCI_LOGO} alt="IFCI" className="h-8 w-auto"/>
            </div>
            <div>
              <div className="text-sm tracking-widest text-white/70 uppercase">IFCI Limited</div>
              <div className="text-base font-semibold">Pension Helpdesk · Operations</div>
            </div>
          </div>
          <div className="tricolor mt-8 w-32 rounded"/>
        </div>

        <div className="max-w-lg">
          <h1 className="text-3xl lg:text-4xl font-semibold leading-tight">
            AI-Powered Multilingual <span style={{color:'var(--gold)'}}>Voice Bot</span> for the IFCI Pension Helpdesk
          </h1>
          <p className="text-white/75 mt-4 leading-relaxed">
            24×7 pensioner servicing across 6 languages. Authentication with DOB and OTP. Live LIC payment status. Warm handover with full context. Built for IFCI ex-employees and family pensioners.
          </p>

          <div className="grid grid-cols-3 gap-4 mt-10 max-w-md">
            <div>
              <div className="text-2xl font-semibold tabnum">99.5%</div>
              <div className="text-xs text-white/60">Platform uptime</div>
            </div>
            <div>
              <div className="text-2xl font-semibold tabnum">6</div>
              <div className="text-xs text-white/60">Languages at go-live</div>
            </div>
            <div>
              <div className="text-2xl font-semibold tabnum">70%</div>
              <div className="text-xs text-white/60">Call deflection target</div>
            </div>
          </div>
        </div>

        <div className="text-xs text-white/50">
          IFCI Tower, 61 Nehru Place, New Delhi 110019 · Confidential · For pilot demonstration only
        </div>
      </div>

      {/* Right form panel */}
      <div className="lg:col-span-2 bg-white p-8 lg:p-12 flex items-center justify-center">
        <form onSubmit={submit} className="w-full max-w-sm">
          <div className="mb-6">
            <div className="text-xs uppercase tracking-widest" style={{color:'var(--ink-faint)'}}>Sign in</div>
            <h2 className="text-2xl font-semibold mt-1">Operations Console</h2>
            <p className="text-sm mt-1" style={{color:'var(--ink-soft)'}}>Access restricted to authorised IFCI staff.</p>
          </div>

          {/* One-click demo access — top of form for visibility */}
          <button type="button" onClick={signInDirect}
            className="btn-primary w-full py-3 rounded font-medium text-sm flex items-center justify-center gap-2 mb-3">
            <Icon name="arrowRight" className="w-4 h-4" />
            Sign in as demo user (one click)
          </button>
          <div className="text-[11px] text-center mb-5" style={{color:'var(--ink-faint)'}}>
            Skips the form · uses the pre-configured demo account
          </div>

          <div className="flex items-center gap-2 my-4">
            <div className="flex-1 h-px" style={{background:'var(--border)'}}/>
            <div className="text-[10px] uppercase tracking-widest" style={{color:'var(--ink-faint)'}}>or sign in manually</div>
            <div className="flex-1 h-px" style={{background:'var(--border)'}}/>
          </div>

          <label className="block text-xs font-medium mb-1" style={{color:'var(--ink-soft)'}}>Work email</label>
          <input className="input" type="email" value={email} onChange={(e)=>{setEmail(e.target.value); setErr("");}} placeholder="firstname.lastname@ifciltd.com"/>

          <label className="block text-xs font-medium mt-4 mb-1" style={{color:'var(--ink-soft)'}}>Password</label>
          <div className="relative">
            <input className="input pr-16" type={showPw ? "text" : "password"} value={pw} onChange={(e)=>{setPw(e.target.value); setErr("");}} placeholder="••••••••" />
            <button type="button" onClick={()=>setShowPw(s=>!s)} className="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-medium" style={{color:'var(--accent)'}}>{showPw ? "Hide" : "Show"}</button>
          </div>

          {err && (
            <div className="mt-3 text-xs px-3 py-2 rounded flex items-start gap-2" style={{background:'#fdecec', color:'var(--bad)'}}>
              <Icon name="info" className="w-3.5 h-3.5 mt-0.5 shrink-0"/>
              <span>{err}</span>
            </div>
          )}

          <div className="grid grid-cols-2 gap-2 mt-5">
            <button type="button" onClick={autofill} className="text-sm py-2 px-3 rounded font-medium border" style={{borderColor:'var(--accent)', color:'var(--accent)'}}>
              Fill demo creds
            </button>
            <button type="submit" className="btn-primary py-2 px-3 rounded font-medium text-sm">
              Sign in
            </button>
          </div>

          <div className="mt-3 text-[11px] text-center" style={{color:'var(--ink-faint)'}}>Protected by mTLS · IP whitelist · Multi-factor</div>

          <div className="mt-6 p-3 rounded border" style={{borderColor:'var(--border)', background:'#fafbfc'}}>
            <div className="flex items-center gap-2 mb-2">
              <Icon name="info" className="w-4 h-4" />
              <div className="text-xs font-medium">Demo access · for reference</div>
            </div>
            <div className="text-xs tabnum" style={{color:'var(--ink-soft)'}}>
              Email: <span className="font-medium" style={{color:'var(--ink)'}}>{DEMO_USER.email}</span><br/>
              Password: <span className="font-medium" style={{color:'var(--ink)'}}>{DEMO_USER.password}</span>
            </div>
          </div>
        </form>
      </div>
    </div>
  );
}

/* =========================================================
 * APP SHELL — sidebar nav + topbar
 * ========================================================= */
const NAV = [
  // Operations first — Dashboard is the landing
  { key: "dashboard", label: "Operations Dashboard", icon: "grid", group: "Analytics" },
  { key: "analytics", label: "Analytics & Reports", icon: "chart", group: "Analytics" },
  // Live work
  { key: "agent", label: "Agent Console", icon: "headset", group: "Calls" },
  { key: "pensioners", label: "Queue & Callbacks", icon: "users", group: "Calls" },
  { key: "tickets", label: "Ticket Dashboard", icon: "file", group: "Calls" },
  { key: "history", label: "Call History", icon: "list", group: "Calls" },
  // Configuration
  { key: "intents", label: "Intents & Prompts", icon: "bot", group: "Configuration" },
  { key: "holidays", label: "Holiday Calendar", icon: "calendar", group: "Configuration" },
  { key: "integrations", label: "Integrations", icon: "plug", group: "Configuration" },
  // Security
  { key: "audit", label: "Audit Trail", icon: "log", group: "Security" },
  // Showcase — second-last
  { key: "simulator", label: "Live Call Simulator", icon: "phone", group: "Demo" },

  { key: "settings", label: "Settings", icon: "settings", group: "System" },
];

function AppShell({ user, onLogout, screen, setScreen, children, title, subtitle, action }) {
  const groups = useMemo(() => {
    const map = new Map();
    NAV.forEach(item => {
      if (!map.has(item.group)) map.set(item.group, []);
      map.get(item.group).push(item);
    });
    return Array.from(map.entries());
  }, []);

  return (
    <div className="flex h-screen overflow-hidden">
      {/* Sidebar */}
      <aside className="w-64 flex flex-col shrink-0" style={{background:'var(--sidebar)'}}>
        <div className="p-4 border-b" style={{borderColor:'rgba(255,255,255,0.08)'}}>
          <div className="flex items-center gap-3">
            <div className="bg-white rounded-md p-1.5 shrink-0">
              <img src={IFCI_LOGO} alt="IFCI" className="h-6 w-auto"/>

            <div className="min-w-0">
              <div className="text-white text-sm font-semibold leading-tight">IFCI Pension</div>
              <div className="text-[11px] uppercase tracking-wider" style={{color:'var(--gold)'}}>Voice Bot · Ops</div>
            </div>
          </div>
        </div>

        <nav className="flex-1 overflow-y-auto scroll-thin py-3">
          {groups.map(([groupName, items]) => (
            <div key={groupName} className="mb-3">
              <div className="px-4 py-1.5 text-[10px] uppercase tracking-widest font-medium" style={{color:'#6f7d94'}}>{groupName}</div>
              {items.map(item => (
                <button
                  key={item.key}
                  onClick={() => setScreen(item.key)}
                  className={`nav-item w-full flex items-center gap-3 px-4 py-2 text-sm border-l-3 border-transparent ${screen === item.key ? "active" : ""}`}
                  style={{borderLeftWidth:'3px', borderLeftColor: screen === item.key ? 'var(--gold)' : 'transparent'}}
                >
                  <span className="nav-icon shrink-0"><Icon name={item.icon} className="w-4 h-4"/></span>
                  <span className="flex-1 text-left">{item.label}</span>
                  {item.soon && <span className="text-[9px] uppercase tracking-wider px-1.5 py-0.5 rounded" style={{background:'rgba(200,147,47,0.18)', color:'var(--gold)'}}>Next</span>}

              ))}

        </nav>

        <div className="p-3 border-t" style={{borderColor:'rgba(255,255,255,0.08)'}}>

            <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold text-white" style={{background:'var(--accent)'}}>
              {user.name.split(" ").map(s=>s[0]).slice(0,2).join("")}
            </div>
            <div className="flex-1 min-w-0">
              <div className="text-white text-xs font-medium truncate">{user.name}</div>
              <div className="text-[10px] truncate" style={{color:'#6f7d94'}}>{user.role}</div>
            </div>
            <button onClick={onLogout} title="Sign out" className="text-white/60 hover:text-white">
              <Icon name="logout" className="w-4 h-4"/>
            </button>
          </div>
        </div>
      </aside>

      {/* Main */}
      <main className="flex-1 flex flex-col overflow-hidden">
        <header className="bg-white border-b flex items-center px-6 h-14 shrink-0" style={{borderColor:'var(--border)'}}>
          <div className="flex-1 min-w-0">
            <div className="text-xs" style={{color:'var(--ink-faint)'}}>IFCI Pension Helpdesk · Operations</div>
            <div className="text-sm font-semibold truncate">{title}</div>
          </div>
          <div className="flex items-center gap-2">
            <div className="chip" style={{background:'var(--accent-soft)', color:'var(--accent)'}}>
              <span className="chip-dot" style={{background:'var(--ok)'}}></span>
              Platform: Operational
            </div>
            <div className="chip border" style={{borderColor:'var(--border)', color:'var(--ink-soft)'}}>
              <Icon name="shield" className="w-3 h-3"/>
              <span>India Region · DPDP-compliant</span>
            </div>
            <button className="btn-ghost rounded p-2"><Icon name="bell" className="w-4 h-4"/></button>
            {action}
          </div>
        </header>

        <div className="tricolor"/>

        <section className="flex-1 overflow-y-auto scroll-thin">
          {subtitle && (
            <div className="px-6 pt-5 pb-1">
              <p className="text-sm" style={{color:'var(--ink-soft)'}}>{subtitle}</p>
            </div>
          )}
          {children}
        </section>
      </main>
    </div>
  );
}

function PhoneKeypad({ digits, onPress, onClear, expected, hint }) {
  const keys = ["1","2","3","4","5","6","7","8","9","*","0","#"];
  return (
    <div className="mt-3">
      <div className="text-[10px] uppercase tracking-widest mb-2" style={{color:'var(--ink-faint)'}}>{hint || "Use keypad or speak"}</div>
      <div className="card p-3">
        <div className="flex items-center justify-between mb-2">
          <div className="text-lg tabnum font-medium tracking-widest" style={{color:'var(--ink)'}}>
            {digits.split("").map((d,i)=>(<span key={i} className="inline-block w-5 text-center">{d}</span>))}
            {Array.from({length: Math.max(0, (expected||6)-digits.length)}).map((_,i)=>(<span key={"e"+i} className="inline-block w-5 text-center" style={{color:'var(--ink-faint)'}}>·</span>))}
          </div>
          <button onClick={onClear} className="text-xs" style={{color:'var(--accent)'}}>Clear</button>
        </div>
        <div className="grid grid-cols-3 gap-2">
          {keys.map(k => (
            <button key={k} onClick={()=>onPress(k)} className="rounded text-base font-medium py-2.5 hover:bg-gray-100" style={{background:'#f5f6f8'}}>{k}</button>

        </div>
      </div>
    </div>
  );
}

function TraceItem({ time, kind, label, ms, status="ok" }) {
  const statusColor = status === "ok" ? "var(--ok)" : status === "warn" ? "var(--warn)" : "var(--bad)";
  return (
    <div className="flex gap-3 text-xs py-1.5 border-b last:border-0 fade-up" style={{borderColor:'var(--border)'}}>
      <div className="tabnum w-16 shrink-0" style={{color:'var(--ink-faint)'}}>{time}</div>
      <div className="w-20 shrink-0">
        <span className="chip" style={{background:'#f5f6f8', color:'var(--ink-soft)'}}>{kind}</span>
      </div>
      <div className="flex-1 truncate">{label}</div>
      {ms !== undefined && <div className="tabnum shrink-0" style={{color: ms > 1500 ? "var(--warn)" : statusColor}}>{ms}ms</div>}
    </div>
  );
}

function ScreenSimulator() {
  const [callerIdx, setCallerIdx] = useState(0);
  const caller = CALLERS[callerIdx];

  // call state machine
  // idle -> ringing -> greeted -> langPicked -> recognised -> dobAsked -> dobOk
  //  -> otpSent -> otpOk -> intentAsked -> intent... -> rating -> ended
  const [state, setState] = useState("idle");
  const [transcript, setTranscript] = useState([]); // messages
  const [trace, setTrace] = useState([]); // system trace
  const [secs, setSecs] = useState(0);
  const [speaking, setSpeaking] = useState(false);
  const [keypad, setKeypad] = useState("");
  const [keypadExpected, setKeypadExpected] = useState(8); // DOB DDMMYYYY
  const [otp, setOtp] = useState("");
  const [otpDigits, setOtpDigits] = useState("");
  const [rating, setRating] = useState(null);
  const [running, setRunning] = useState(false);
  const transcriptRef = useRef(null);
  const traceRef = useRef(null);
  const tickRef = useRef(null);

  // The simulated language. Hindi by default for caller 0.
  const lang = caller.lang;

  const pushBot = (text, trans) => {
    setTranscript(t => [...t, { from: "bot", text, transcript: trans, lang }]);
  };
  const pushCaller = (text, trans, langOverride) => {
    setTranscript(t => [...t, { from: "caller", text, transcript: trans, lang: langOverride || lang }]);
  };
  const pushTrace = (kind, label, ms, status="ok") => {
    setTrace(t => [...t, { time: nowTime(), kind, label, ms, status }]);
  };

  const reset = () => {
    if (tickRef.current) clearInterval(tickRef.current);
    setState("idle"); setTranscript([]); setTrace([]); setSecs(0);
    setSpeaking(false); setKeypad(""); setOtp(""); setOtpDigits(""); setRating(null);
    setRunning(false);
  };

  useEffect(() => { reset(); /* eslint-disable-line */ }, [callerIdx]);

  // auto-scroll
  useEffect(() => { if (transcriptRef.current) transcriptRef.current.scrollTop = transcriptRef.current.scrollHeight; }, [transcript]);
  useEffect(() => { if (traceRef.current) traceRef.current.scrollTop = traceRef.current.scrollHeight; }, [trace]);

  // call timer
  useEffect(() => {
    if (state === "ringing" || state === "ended" || state === "idle") return;
    tickRef.current = setInterval(() => setSecs(s => s + 1), 1000);
    return () => { if (tickRef.current) clearInterval(tickRef.current); };
  }, [state]);

  // Convenience say (bot speaks with wave then pushes message)
  const say = async (msg) => {
    setSpeaking(true);
    await sleep(700);
    pushBot(msg.text, msg.trans);
    setSpeaking(false);
    await sleep(450);
  };

  // === The scripted flow ===
  const runScript = useCallback(async () => {
    setRunning(true);
    setState("ringing");
    pushTrace("Telephony", `Inbound call from ${caller.mobile}`, 0);
    await sleep(900);
    pushTrace("Telephony", "Call answered in 1 ring (SIP trunk · Mumbai region)", 220);
    await sleep(400);

    setState("greeted");
    pushTrace("ASR", "Voice activity detected", 80);
    await say(PROMPT.greeting[lang] || PROMPT.greeting.en);
    pushTrace("Engine", "Welcome played in Hindi + English (FR-001)", 320);

    // simulate caller pressing 1 for Hindi (or 3 for Bengali, etc.)
    await sleep(900);
    const pickKey = lang === "hi" ? "1" : lang === "en" ? "2" : lang === "bn" ? "3" : "4";
    pushCaller(pickKey, "", "en");
    pushTrace("DTMF", `Caller selected key ${pickKey} → ${LANGS.find(l=>l.code===lang).english}`, 120);

    setState("langPicked");
    await sleep(400);

    // CLI lookup
    pushTrace("API · PensionMaster", `GET /pensioner?cli=${caller.mobile.replace(/\s|\+/g,"")}`, 480);
    await sleep(500);
    pushTrace("API · PensionMaster", `200 OK · ${caller.id} · ${caller.name} · DOB on file`, 0);
    setState("recognised");

    await say(PROMPT.recognise[lang] ? PROMPT.recognise[lang](caller.title + " " + caller.name.split(" ")[0]) : PROMPT.recognise.en(caller.title + " " + caller.name.split(" ")[0]));
    await sleep(500);
    pushCaller(lang === "hi" ? "हाँ।" : lang === "bn" ? "হ্যাঁ।" : lang === "ta" ? "ஆம்." : "Yes.", "Yes", lang);
    pushTrace("ASR", "Confirmation captured · confidence 0.96", 240);

    // Ask DOB
    setState("dobAsked");
    setKeypadExpected(8);
    await say(PROMPT.askDob[lang] || PROMPT.askDob.en);
    await sleep(400);

    // Caller speaks DOB
    pushCaller(caller.dobSpoken, caller.dob.replace(/-/g, "/"), lang);
    pushTrace("NLU", `Entity extracted: dob = ${caller.dob}`, 380);
    pushTrace("Auth", "Step 1 of 2: DOB match against master · ✓", 220);

    await sleep(500);
    setState("otpSent");
    // Generate the OTP (8 4 1 6 2 0 style) — fixed for demo
    const realOtp = "841620";
    setOtp(realOtp);
    pushTrace("SMS Gateway", `POST /sms · OTP to ${caller.mobile}`, 480);
    await sleep(600);
    pushTrace("SMS Gateway", `delivered in 4.2s · template OTP_${lang.toUpperCase()}`, 0);
    await say(PROMPT.otpSent[lang] ? PROMPT.otpSent[lang](caller.mobileLast4) : PROMPT.otpSent.en(caller.mobileLast4));

    // — pause here so user can punch the OTP themselves OR auto-fill —
    setState("awaitOtp");
    setRunning(false);
  }, [caller, lang]);

  // After OTP is entered correctly, continue
  const continueAfterOtp = useCallback(async () => {
    setRunning(true);
    await sleep(300);
    pushTrace("Auth", "Step 2 of 2: OTP verified · session opened (TTL: call duration)", 180);
    setState("authOk");
    await say(PROMPT.authOk[lang] || PROMPT.authOk.en);
    await sleep(400);

    // Caller states their problem
    if (caller.intent === "payment_status") {
      pushCaller("इस महीने की पेंशन नहीं आई है।", "My pension for this month hasn't come.", "hi");
      pushTrace("NLU", "Intent: payment_status · confidence 0.94", 340);
      await sleep(500);
      pushTrace("API · LIC Feed", `GET /annuity/payment?pid=${caller.id}&month=current`, 1240);
      await sleep(900);
      pushTrace("API · LIC Feed", "200 OK · status=scheduled · reason=LIC_MAINT · expected=05 Apr 2026", 0);
      pushTrace("HolidayCalendar", "next working day → 05 Apr 2026 (Sun excluded)", 90);

      setSpeaking(true);
      await sleep(800);
      pushBot(PROMPT.payAnswer[lang] ? PROMPT.payAnswer[lang](caller.payment).text : PROMPT.payAnswer.en(caller.payment).text,
              lang !== "en" ? PROMPT.payAnswer.en(caller.payment).text : "");
      setSpeaking(false);
      await sleep(700);
      pushCaller("हाँ, भेज दीजिए।", "Yes, please send.", "hi");
      pushTrace("SMS Gateway", `POST /sms · payment summary in ${lang} → ${caller.mobile}`, 410);
      await sleep(600);
      setSpeaking(true);
      pushBot(lang === "hi" ? "भेज दिया। क्या मैं और कुछ कर सकता हूँ?" : "Sent. Anything else?", lang === "hi" ? "Sent. Anything else?" : "");
      setSpeaking(false);
      await sleep(600);
      pushCaller("नहीं।", "No.", "hi");
    }
    else if (caller.intent === "life_certificate") {
      pushCaller("আমার লাইফ সার্টিফিকেট কি জমা পড়েছে?", "Has my life certificate been received?", "bn");
      pushTrace("NLU", "Intent: life_certificate_status · confidence 0.91", 320);
      await sleep(500);
      pushTrace("API · PensionMaster", `GET /lc?pid=${caller.id}&year=${new Date().getFullYear()}`, 880);
      await sleep(700);
      pushTrace("API · PensionMaster", `200 OK · status=received_under_review · received=${caller.lcStatus.received}`, 0);
      setSpeaking(true);
      await sleep(700);
      pushBot(PROMPT.lcAnswer.bn(caller.lcStatus).text, PROMPT.lcAnswer.bn(caller.lcStatus).trans);
      setSpeaking(false);
      await sleep(700);
      pushCaller("ধন্যবাদ।", "Thank you.", "bn");
    }
    else if (caller.intent === "handover_bank_change") {
      pushCaller("I want to change my bank account.", "", "en");
      pushTrace("NLU", "Intent: bank_account_change · OUT-OF-SCOPE (FR-061)", 280);
      await sleep(500);
      pushTrace("Engine", "Decision: read process summary + email form + offer handover", 60);
      setSpeaking(true);
      await sleep(700);
      pushBot(PROMPT.handover.en.text, "");
      setSpeaking(false);
      await sleep(500);
      pushTrace("Email Gateway", "POST /email · form=bank_change_request.pdf", 510);
      await sleep(400);
      pushTrace("Handover", "Office hours: TRUE · queue=ex_employees_cell · agents available=2", 70);
      pushTrace("Handover", "Context payload sent to agent console (FR-093)", 130);
      setState("handover");
      setRunning(false);
      return;
    }

    // ratings prompt
    setState("rating");
    await sleep(500);
    setSpeaking(true);
    pushBot((PROMPT.rating[lang] || PROMPT.rating.en).text, lang !== "en" ? (PROMPT.rating[lang] || PROMPT.rating.en).trans : "");
    setSpeaking(false);
    setRunning(false);
  }, [caller, lang]);

  // OTP handling — when caller punches the correct OTP, move on
  const onKeypadPress = (k) => {
    if (state === "awaitOtp") {
      if (k === "*" || k === "#") return;
      if (otpDigits.length < 6) {
        const next = otpDigits + k;
        setOtpDigits(next);
        if (next.length === 6) {
          // submit
          if (next === otp) {
            pushCaller(next, "", lang);
            setTimeout(() => continueAfterOtp(), 300);
          } else {
            pushCaller(next, "", lang);
            pushTrace("Auth", `OTP mismatch · retries left: 2`, 80, "warn");
            setTimeout(() => setOtpDigits(""), 700);
          }
        }
      }
    }
  };
  const fillCorrectOtp = () => {
    setOtpDigits(otp);
    pushCaller(otp, "", lang);
    setTimeout(() => continueAfterOtp(), 300);
  };

  const submitRating = (r) => {
    setRating(r);
    pushCaller(String(r), "", lang);
    pushTrace("Engine", `Rating captured: ${r}/5`, 40);
    setTimeout(async () => {
      setSpeaking(true);
      await sleep(500);
      pushBot((PROMPT.bye[lang] || PROMPT.bye.en).text, lang !== "en" ? (PROMPT.bye[lang] || PROMPT.bye.en).trans : "");
      setSpeaking(false);
      await sleep(400);
      pushTrace("Telephony", `Call ended · duration ${secs}s · transcript persisted`, 0);
      pushTrace("Audit", "Session sealed · stored in India region (DPDP §3)", 90);
      setState("ended");
    }, 400);
  };

  const completeHandover = () => {
    pushTrace("Telephony", "Warm transfer · ringing agent station AG-04", 240);
    pushTrace("Telephony", "Agent AG-04 picked up · bot detached", 1200);
    setState("ended");
  };

  const inCall = !["idle", "ended"].includes(state);

  return (
    <div className="px-6 py-5">
      {/* Caller picker + actions */}
      <div className="flex flex-wrap items-center gap-3 mb-5">
        <div className="text-xs uppercase tracking-widest" style={{color:'var(--ink-faint)'}}>Demo caller</div>
        <div className="flex gap-1 p-1 rounded border" style={{borderColor:'var(--border)', background:'#fff'}}>
          {CALLERS.map((c, i) => (
            <button key={c.id} onClick={() => setCallerIdx(i)} disabled={inCall && running}
              className={`text-xs px-3 py-1.5 rounded ${callerIdx === i ? "btn-primary" : "btn-ghost"} ${inCall && running ? "opacity-40 cursor-not-allowed" : ""}`}>
              {c.name.split(" ")[0]} · {LANGS.find(l=>l.code===c.lang).english}
            </button>
          ))}
        </div>
        <div className="ml-auto flex items-center gap-2">
          {state === "idle" && (
            <button onClick={runScript} className="btn-primary text-sm px-4 py-2 rounded font-medium flex items-center gap-2">
              <Icon name="phone" className="w-4 h-4"/> Start incoming call
            </button>
          )}
          {state === "ended" && (
            <button onClick={reset} className="btn-primary text-sm px-4 py-2 rounded font-medium flex items-center gap-2">
              <Icon name="refresh" className="w-4 h-4"/> New call
            </button>
          )}
          {inCall && (
            <button onClick={reset} className="text-sm px-4 py-2 rounded font-medium border" style={{borderColor:'var(--border)', color:'var(--ink-soft)'}}>
              End call
            </button>
          )}
        </div>
      </div>

      <div className="grid grid-cols-12 gap-4">
        {/* PHONE */}
        <div className="col-span-12 lg:col-span-4">
          <div className="phone max-w-[330px] mx-auto">
            <div className="phone-screen" style={{minHeight: 580}}>
              <div className="phone-notch"/>
              {state === "idle" && (
                <div className="h-[580px] flex flex-col items-center justify-center text-center p-6">
                  <div className="relative">
                    <div className="absolute inset-0 rounded-full pulse-ring" style={{background:'var(--accent-soft)'}}></div>
                    <div className="relative w-20 h-20 rounded-full flex items-center justify-center" style={{background:'var(--accent)'}}>
                      <Icon name="phone" className="w-9 h-9 text-white"/>
                    </div>
                  </div>
                  <div className="mt-6 text-sm font-medium">Ready to call</div>
                  <div className="text-xs mt-1" style={{color:'var(--ink-soft)'}}>Press <span className="font-medium" style={{color:'var(--accent)'}}>Start incoming call</span> to simulate a pensioner dialling in from <span className="font-medium">{caller.mobile}</span></div>
                  <div className="mt-6 w-full text-left text-xs space-y-1.5 p-3 rounded" style={{background:'#f5f6f8'}}>
                    <div className="flex justify-between"><span style={{color:'var(--ink-faint)'}}>Pensioner</span><span className="font-medium">{caller.name}</span></div>
                    <div className="flex justify-between"><span style={{color:'var(--ink-faint)'}}>ID</span><span className="font-medium tabnum">{caller.id}</span></div>
                    <div className="flex justify-between"><span style={{color:'var(--ink-faint)'}}>Language</span><span className="font-medium">{LANGS.find(l=>l.code===caller.lang).english}</span></div>
                    <div className="flex justify-between"><span style={{color:'var(--ink-faint)'}}>Location</span><span className="font-medium">{caller.location}</span></div>
                  </div>
                </div>
              )}

              {state === "ringing" && (
                <div className="h-[580px] flex flex-col items-center justify-center text-center p-6" style={{background:'#0b2545'}}>
                  <div className="text-[10px] uppercase tracking-widest text-white/60">Incoming call</div>
                  <div className="mt-2 text-white text-lg font-medium">{caller.name}</div>
                  <div className="text-white/70 text-sm tabnum">{caller.mobile}</div>
                  <div className="relative mt-12">
                    <div className="absolute inset-0 rounded-full pulse-ring" style={{background:'rgba(31,157,87,0.4)'}}></div>
                    <div className="absolute inset-0 rounded-full pulse-ring" style={{background:'rgba(31,157,87,0.4)', animationDelay: '0.6s'}}></div>
                    <div className="relative w-20 h-20 rounded-full flex items-center justify-center" style={{background:'var(--ok)'}}>
                      <Icon name="phone" className="w-9 h-9 text-white"/>
                    </div>
                  </div>
                  <div className="text-white/60 text-xs mt-10">Auto-answering...</div>
                </div>
              )}

              {(inCall && state !== "ringing") && (
                <div className="flex flex-col" style={{height: 580}}>
                  <PhoneHeader callerName={caller.name} lang={lang} secs={secs}/>
                  <PhoneCallerBar caller={caller} recognised={state !== "greeted" && state !== "langPicked"}/>
                  <div ref={transcriptRef} className="flex-1 overflow-y-auto scroll-thin p-3 bg-white">
                    {transcript.map((m, i) => (
                      <PhoneBubble key={i} from={m.from} text={m.text} transcript={m.transcript} lang={m.lang || lang} fromSpeaking={i === transcript.length - 1 && speaking && m.from === "bot"}/>
                    ))}
                    {speaking && transcript.length > 0 && transcript[transcript.length-1].from !== "bot" && (
                      <div className="flex gap-2 mb-3"><span className="typ"></span><span className="typ"></span><span className="typ"></span></div>
                    )}
                  </div>

                  {/* Bottom area: keypad/rating/handover */}
                  <div className="p-3 border-t" style={{borderColor:'var(--border)', background:'#fafbfc'}}>
                    {state === "awaitOtp" && (
                      <div>
                        <PhoneKeypad
                          digits={otpDigits}
                          expected={6}
                          hint={`Enter the 6-digit OTP · expected ${otp} (demo)`}
                          onPress={onKeypadPress}
                          onClear={()=>setOtpDigits("")}
                        />
                        <button onClick={fillCorrectOtp} className="btn-primary w-full mt-2 py-2 rounded text-xs font-medium">Auto-fill OTP & continue</button>
                      </div>
                    )}
                    {state === "rating" && (
                      <div>
                        <div className="text-[10px] uppercase tracking-widest mb-2" style={{color:'var(--ink-faint)'}}>Rate 1 to 5</div>
                        <div className="grid grid-cols-5 gap-2">
                          {[1,2,3,4,5].map(n => (
                            <button key={n} onClick={()=>submitRating(n)} className="card py-3 text-lg font-semibold hover:bg-accent-soft" style={{borderColor: rating === n ? 'var(--accent)' : 'var(--border)'}}>{n}</button>
                          ))}
                        </div>
                      </div>
                    )}
                    {state === "handover" && (
                      <div>
                        <div className="text-[10px] uppercase tracking-widest mb-2" style={{color:'var(--ink-faint)'}}>Warm transfer in progress</div>
                        <div className="text-xs mb-3" style={{color:'var(--ink-soft)'}}>Bot is connecting you to an agent. Pensioner doesn't need to repeat anything — full context already on the agent's screen.</div>
                        <button onClick={completeHandover} className="btn-primary w-full py-2 rounded text-xs font-medium flex items-center justify-center gap-2">
                          <Icon name="transfer" className="w-3 h-3"/> Agent AG-04 picks up
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {state === "ended" && (
                <div className="h-[580px] flex flex-col items-center justify-center text-center p-6">
                  <div className="w-16 h-16 rounded-full flex items-center justify-center glow-green" style={{background:'var(--ok)'}}>
                    <Icon name="check" className="w-8 h-8 text-white"/>
                  </div>
                  <div className="mt-5 text-sm font-medium">Call closed</div>
                  <div className="text-xs mt-1" style={{color:'var(--ink-soft)'}}>Duration {String(Math.floor(secs/60)).padStart(2,"0")}:{String(secs%60).padStart(2,"0")} · transcript and recording stored in India region</div>
                  <div className="mt-5 w-full p-3 rounded text-left text-xs" style={{background:'#f5f6f8'}}>
                    <div className="flex justify-between mb-1"><span style={{color:'var(--ink-faint)'}}>Outcome</span><span className="font-medium">{caller.intent === "handover_bank_change" ? "Warm transfer to agent" : "Resolved by bot"}</span></div>
                    <div className="flex justify-between mb-1"><span style={{color:'var(--ink-faint)'}}>Auth</span><span className="font-medium">DOB + OTP · ✓</span></div>
                    {rating && <div className="flex justify-between"><span style={{color:'var(--ink-faint)'}}>Rating</span><span className="font-medium">{rating} / 5</span></div>}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>

        {/* CALL FLOW / STATE */}
        <div className="col-span-12 lg:col-span-4">
          <div className="card">
            <div className="px-4 py-3 border-b flex items-center justify-between" style={{borderColor:'var(--border)'}}>
              <div>
                <div className="text-[10px] uppercase tracking-widest" style={{color:'var(--ink-faint)'}}>Master call flow</div>
                <div className="text-sm font-medium">17-step pensioner journey</div>
              </div>
              <span className="chip" style={{background:'var(--accent-soft)', color:'var(--accent)'}}>SOW §12.1</span>
            </div>
            <div className="p-4 space-y-1.5 text-xs max-h-[580px] overflow-y-auto scroll-thin">
              <FlowStep n={1} label="Bot answers within 2 rings" done={["greeted","langPicked","recognised","dobAsked","otpSent","awaitOtp","authOk","rating","ended","handover"].includes(state)} active={state==="ringing"}/>
              <FlowStep n={2} label="Welcome in Hindi + English" done={["langPicked","recognised","dobAsked","otpSent","awaitOtp","authOk","rating","ended","handover"].includes(state)} active={state==="greeted"}/>
              <FlowStep n={3} label="Caller selects language" done={["recognised","dobAsked","otpSent","awaitOtp","authOk","rating","ended","handover"].includes(state)} active={state==="langPicked"}/>
              <FlowStep n={4} label="CLI match against master" done={["dobAsked","otpSent","awaitOtp","authOk","rating","ended","handover"].includes(state)} active={state==="recognised"}/>
              <FlowStep n={5} label="DOB capture (voice + DTMF)" done={["otpSent","awaitOtp","authOk","rating","ended","handover"].includes(state)} active={state==="dobAsked"}/>
              <FlowStep n={6} label="OTP issued to registered mobile" done={["awaitOtp","authOk","rating","ended","handover"].includes(state)} active={state==="otpSent"}/>
              <FlowStep n={7} label="OTP verified · session opened" done={["authOk","rating","ended","handover"].includes(state)} active={state==="awaitOtp"}/>
              <FlowStep n={8} label="Open intent capture" done={["rating","ended","handover"].includes(state)} active={state==="authOk"}/>
              <FlowStep n={9} label="Intent classified · workflow runs" done={["rating","ended","handover"].includes(state)} active={state==="authOk"}/>
              <FlowStep n={10} label="Answer composed in caller's language" done={["rating","ended"].includes(state)} active={false}/>
              <FlowStep n={11} label="SMS confirmation on request" done={["rating","ended"].includes(state)} active={false}/>
              <FlowStep n={12} label="Step-up auth for sensitive intent" done={false} active={false} note="—"/>
              <FlowStep n={13} label="Sentiment scored per turn" done={["rating","ended","handover"].includes(state)} active={false}/>
              <FlowStep n={14} label="Anything else loop" done={["rating","ended"].includes(state)} active={false}/>
              <FlowStep n={15} label="Post-call rating (1–5)" done={state==="ended" && rating} active={state==="rating"}/>
              <FlowStep n={16} label="Transcript + recording stored" done={state==="ended"} active={false}/>
              <FlowStep n={17} label="Audit log sealed" done={state==="ended"} active={false}/>
              {state === "handover" && (
                <div className="mt-3 p-2 rounded text-xs fade-up" style={{background:'var(--gold-soft)', color:'#8a5b00'}}>
                  Branch: warm transfer to human agent (FR-091). Context payload sent. Pensioner not asked to repeat.
                </div>
              )}
            </div>
          </div>
        </div>

        {/* SYSTEM TRACE */}
        <div className="col-span-12 lg:col-span-4">
          <div className="card">
            <div className="px-4 py-3 border-b flex items-center justify-between" style={{borderColor:'var(--border)'}}>
              <div>
                <div className="text-[10px] uppercase tracking-widest" style={{color:'var(--ink-faint)'}}>System trace</div>
                <div className="text-sm font-medium">Telephony · ASR · NLU · APIs</div>

        </div>
      </div>

      {/* requirement traceability footer */}
      <div className="mt-5 card p-4">
        <div className="text-[10px] uppercase tracking-widest mb-3" style={{color:'var(--ink-faint)'}}>Functional Requirements covered in this simulation</div>
        <div className="flex flex-wrap gap-2">

              <Icon name="check" className="w-3 h-3" /> {label}

}

function FlowStep({ n, label, active, done, note }) {
  return (
    <div className={`flex items-center gap-2 py-1 ${active ? "fade-up" : ""}`}>
      <div className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-medium shrink-0 ${active ? "text-white" : done ? "text-white" : ""}`}
           style={{
             background: active ? 'var(--gold)' : done ? 'var(--ok)' : '#f0f2f5',
             color: !active && !done ? 'var(--ink-faint)' : '#fff'
           }}>
        {done ? <Icon name="check" className="w-3 h-3"/> : n}
      </div>
      <div className="flex-1 text-xs" style={{color: active ? 'var(--ink)' : done ? 'var(--ink-soft)' : 'var(--ink-faint)'}}>{label}</div>
      {note && <span className="text-[10px]" style={{color:'var(--ink-faint)'}}>{note}</span>}
    </div>
  );
}

function seedRandom(seed) {
  let s = seed;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}

function generateCallHistory() {

    let outcome = SEED_OUTCOME_DIST[Math.floor(rand() * SEED_OUTCOME_DIST.length)];
    if (intent === "bank_change" || intent === "family_pension" || intent === "grievance") {
      outcome = rand() < 0.65 ? "transferred" : (rand() < 0.5 ? "callback" : outcome);
    }
    const ageMinutes = Math.floor(rand() * 60 * 24 * 14);
    const startedAt = new Date(now.getTime() - ageMinutes * 60000);
    const duration = 30 + Math.floor(rand() * 200);
    const rating = outcome === "bot_resolved" ? 3 + Math.floor(rand() * 3) : (outcome === "transferred" ? (rand() < 0.5 ? 4 : null) : null);
    const sentiment = outcome === "abandoned" ? "negative" : outcome === "transferred" && intent === "grievance" ? "negative" : rand() < 0.18 ? "negative" : rand() < 0.65 ? "neutral" : "positive";
    list.push({

function StripStat({ label, value, tone, onClick }) {
  const colorMap = {
    ok: { bg: '#e8f5ed', fg: 'var(--ok)' },
    warn: { bg: '#fdf6e7', fg: 'var(--warn)' },
    bad: { bg: '#fdecec', fg: 'var(--bad)' },
    neutral: { bg: '#fff', fg: 'var(--ink)' },
  };
  const c = colorMap[tone] || colorMap.neutral;
  const clickable = !!onClick;
  return (
    <div onClick={onClick} role={clickable ? "button" : undefined} tabIndex={clickable ? 0 : undefined}
      className={`card p-3 flex items-center justify-between ${clickable ? "cursor-pointer transition" : ""}`}
      onMouseEnter={clickable ? (e) => { e.currentTarget.style.borderColor = 'var(--accent)'; } : undefined}
      onMouseLeave={clickable ? (e) => { e.currentTarget.style.borderColor = 'var(--border)'; } : undefined}>
      <div>
        <div className="text-[10px] uppercase tracking-widest" style={{color:'var(--ink-faint)'}}>{label}</div>
        <div className="text-lg font-semibold tabnum mt-0.5">{value}</div>
      </div>
      <div className="w-8 h-8 rounded-full flex items-center justify-center" style={{background: c.bg}}>
        <div className="text-xs font-medium" style={{color: c.fg}}>●</div>
      </div>
    </div>
  );
}

function TabBtn({ label, active, onClick }) {
  return (
    <button onClick={onClick} className={`text-xs px-3 py-1.5 rounded ${active ? "btn-primary" : "btn-ghost"}`}>{label}</button>
  );
}

function QuickActionCard({ icon, label, subLabel, disabled }) {
  return (
    <button disabled={disabled} className={`card p-3 text-left ${disabled ? "opacity-50 cursor-not-allowed" : ""}`} style={{borderColor:'var(--border)'}}>
      <div className="flex items-center gap-2 mb-1">
        <div className="w-7 h-7 rounded flex items-center justify-center" style={{background:'var(--accent-soft)', color:'var(--accent)'}}>
          <Icon name={icon} className="w-4 h-4" />
        </div>
        <div className="text-sm font-medium">{label}</div>
      </div>
      <div className="text-[11px]" style={{color:'var(--ink-faint)'}}>{subLabel}</div>
    </button>
  );
}

/* =========================================================
 * CALL HISTORY — table view + drawer for transcripts
 * ========================================================= */
function ScreenHistory() {
  const nav = useNav();
  const calls = useMemo(() => generateCallHistory(), []);
  const [search, setSearch] = useState("");
  const [langFilter, setLangFilter] = useState("all");
  const [outcomeFilter, setOutcomeFilter] = useState("all");
  const [intentFilter, setIntentFilter] = useState("all");

  const filtered = useMemo(() => {
    return calls.filter(c => {
      if (langFilter !== "all" && c.language !== langFilter) return false;
      if (outcomeFilter !== "all" && c.outcome !== outcomeFilter) return false;
      if (intentFilter !== "all" && c.intent !== intentFilter) return false;
      if (search) {
        const s = search.toLowerCase();
        return c.pensioner.toLowerCase().includes(s) ||
               c.pensionerId.toLowerCase().includes(s) ||
               c.id.toLowerCase().includes(s) ||
               c.mobile.toLowerCase().includes(s);
      }
      return true;
    });
  }, [calls, search, langFilter, outcomeFilter, intentFilter]);

  return (
    <div className="px-6 py-5">
      <div className="card p-3 mb-4 flex flex-wrap items-center gap-2">

          <option value="all">All languages</option>
          {LANGS.map(l => <option key={l.code} value={l.code}>{l.english}</option>)}
        </select>
        <select className="input w-auto" value={intentFilter} onChange={(e)=>setIntentFilter(e.target.value)}>
          <option value="all">All intents</option>
          {Object.entries(INTENTS).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
        </select>
        <select className="input w-auto" value={outcomeFilter} onChange={(e)=>setOutcomeFilter(e.target.value)}>
          <option value="all">All outcomes</option>
          {Object.entries(OUTCOMES).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}

        <div className="text-xs tabnum" style={{color:'var(--ink-soft)'}}>{filtered.length} of {calls.length}</div>
      </div>

      <div className="card overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead style={{background:'#fafbfc'}}>

                <th className="text-left px-4 py-2.5 font-medium">Outcome</th>
                <th className="text-right px-4 py-2.5 font-medium">Duration</th>
                <th className="text-center px-4 py-2.5 font-medium">Sentiment</th>
                <th className="text-center px-4 py-2.5 font-medium">Rating</th>
                <th className="text-center px-4 py-2.5 font-medium">ASR</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(c => (
                <tr key={c.id} onClick={() => nav.drill("call_detail", { call: c })} className="cursor-pointer border-t hover:bg-blue-50/30" style={{borderColor:'var(--border)'}}>
                  <td className="px-4 py-2.5 tabnum text-xs" style={{color:'var(--accent)'}}>{c.id}</td>
                  <td className="px-4 py-2.5 text-xs tabnum" style={{color:'var(--ink-soft)'}}>{new Date(c.startedAt).toLocaleString("en-IN", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"})}</td>
                  <td className="px-4 py-2.5">
                    <div className="font-medium text-xs">{c.pensioner}</div>
                    <div className="text-[10px] tabnum" style={{color:'var(--ink-faint)'}}>{c.pensionerId} · {c.location}</div>
                  </td>
                  <td className="px-4 py-2.5">
                    <span className="chip border" style={{borderColor:'var(--border)', color:'var(--ink-soft)'}}>{LANGS.find(l=>l.code===c.language)?.english}</span>
                  </td>
                  <td className="px-4 py-2.5">
                    <span className="chip" style={{background: INTENTS[c.intent].color + "22", color: INTENTS[c.intent].color}}>{INTENTS[c.intent].label}</span>
                  </td>
                  <td className="px-4 py-2.5">
                    <span className="chip" style={{background: OUTCOMES[c.outcome].color + "22", color: OUTCOMES[c.outcome].color}}>{OUTCOMES[c.outcome].label}</span>
                  </td>
                  <td className="px-4 py-2.5 text-right tabnum text-xs">{Math.floor(c.duration/60)}m {String(c.duration%60).padStart(2,"0")}s</td>
                  <td className="px-4 py-2.5 text-center">
                    <span className="text-xs font-medium" style={{color: c.sentiment==="negative"?"var(--bad)":c.sentiment==="positive"?"var(--ok)":"var(--ink-soft)"}}>
                      {c.sentiment === "positive" ? "+" : c.sentiment === "negative" ? "−" : "○"}
                    </span>
                  </td>
                  <td className="px-4 py-2.5 text-center tabnum text-xs">{c.rating ? `★ ${c.rating}` : "—"}</td>
                  <td className="px-4 py-2.5 text-center tabnum text-xs" style={{color:'var(--ink-soft)'}}>{(c.asrConfidence*100).toFixed(0)}%</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {filtered.length === 0 && (
          <div className="text-center py-12 text-sm" style={{color:'var(--ink-faint)'}}>No calls match the filters.</div>
        )}
      </div>
    </div>
  );
}

/* =========================================================
 * ANALYTICS HELPERS — aggregate the call history into chart-ready data
 * ========================================================= */
function aggregateByDay(calls, days = 14) {
  const result = [];
  const now = new Date("2026-04-23T16:45:00");
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now.getTime() - i * 86400000);
    const dStr = d.toISOString().slice(0, 10);
    const dayCalls = calls.filter(c => c.startedAt.slice(0, 10) === dStr);
    const total = dayCalls.length;
    const resolved = dayCalls.filter(c => c.outcome === "bot_resolved").length;
    const transferred = dayCalls.filter(c => c.outcome === "transferred").length;
    const callback = dayCalls.filter(c => c.outcome === "callback").length;
    const abandoned = dayCalls.filter(c => c.outcome === "abandoned").length;
    const auth_failed = dayCalls.filter(c => c.outcome === "auth_failed").length;
    const ahtSum = dayCalls.reduce((s, c) => s + c.duration, 0);
    const aht = total ? Math.round(ahtSum / total) : 0;
    const deflection = total ? (resolved / total) * 100 : 0;
    // synthesize a daily total scaled up to mimic a real day's volume
    const scale = 18 + Math.floor((d.getDate() * 13) % 14);
    result.push({
      date: d.toLocaleDateString("en-IN", { day: "2-digit", month: "short" }),
      iso: dStr,
      total: total * scale,
      resolved: resolved * scale,
      transferred: transferred * scale,
      callback: callback * scale,
      abandoned: abandoned * scale,
      auth_failed: auth_failed * scale,
      deflection: Number(deflection.toFixed(1)),
      aht,
    });
  }
  return result;
}

function aggregateByIntent(calls) {
  const counts = {};
  calls.forEach(c => { counts[c.intent] = (counts[c.intent] || 0) + 1; });
  return Object.entries(counts).map(([k, v]) => ({
    name: INTENTS[k]?.label || k,
    key: k,
    count: v * 22,
    color: INTENTS[k]?.color || "#5b6472",
  })).sort((a, b) => b.count - a.count);
}

function aggregateByLanguage(calls) {
  const counts = {};
  calls.forEach(c => { counts[c.language] = (counts[c.language] || 0) + 1; });
  const palette = { hi: "#0f4c81", en: "#2b7a78", bn: "#7a4cb9", mr: "#c98a14", ta: "#d23f3f", te: "#1f9d57" };
  return Object.entries(counts).map(([k, v]) => ({
    name: LANGS.find(l => l.code === k)?.english || k,
    key: k,
    count: v * 22,
    color: palette[k] || "#5b6472",
  })).sort((a, b) => b.count - a.count);
}

function aggregateBySentiment(calls) {
  const counts = { positive: 0, neutral: 0, negative: 0 };
  calls.forEach(c => { counts[c.sentiment] = (counts[c.sentiment] || 0) + 1; });
  return [
    { name: "Positive", count: counts.positive * 22, color: "#1f9d57" },
    { name: "Neutral",  count: counts.neutral  * 22, color: "#5b6472" },
    { name: "Negative", count: counts.negative * 22, color: "#d23f3f" },
  ];
}

function aggregateByHour() {
  // typical pension-helpdesk hour-of-day pattern
  const pattern = [3,2,1,1,1,2,4,8,18,32,46,38,29,22,28,35,30,22,16,11,8,6,5,4];
  return pattern.map((v, h) => ({ hour: `${String(h).padStart(2,"0")}:00`, calls: v }));
}

function latencySeries() {
  const days = aggregateByDay([], 14).map(d => d.date);
  return days.map((d, i) => ({
    date: d,
    p50: 240 + Math.round(Math.sin(i*0.7)*40 + 30),
    p95: 660 + Math.round(Math.sin(i*0.4)*80 + 50),
    p99: 1180 + Math.round(Math.sin(i*0.3)*120 + 60),
  }));
}

function Legend4Label({ color, label }) {
  return (
    <span className="flex items-center gap-1 text-[11px]" style={{color:'var(--ink-soft)'}}>
      <span className="w-2.5 h-2.5 rounded-sm" style={{background: color}}></span>{label}
    </span>
  );
}

function Attention({ title, detail, tone, count, onClick }) {
  const colors = {
    bad: { bg: '#fdecec', fg: 'var(--bad)' },
    warn: { bg: '#fdf6e7', fg: 'var(--warn)' },
    ok: { bg: '#e8f5ed', fg: 'var(--ok)' },
    neutral: { bg: '#f5f6f8', fg: 'var(--ink-soft)' },
  };
  const c = colors[tone] || colors.neutral;
  const clickable = !!onClick;
  return (
    <div onClick={onClick} role={clickable ? "button" : undefined} tabIndex={clickable ? 0 : undefined}
      className={`flex items-start gap-3 py-2 border-b last:border-0 ${clickable ? "cursor-pointer hover:bg-blue-50/30 -mx-2 px-2 rounded transition" : ""}`} style={{borderColor:'var(--border)'}}>
      <div className="w-8 h-8 rounded flex items-center justify-center text-xs font-semibold shrink-0" style={{background: c.bg, color: c.fg}}>
        {count}
      </div>
      <div className="flex-1 min-w-0">
        <div className="text-xs font-medium">{title}</div>
        <div className="text-[11px] mt-0.5" style={{color:'var(--ink-faint)'}}>{detail}</div>
      </div>
      {clickable && <Icon name="arrowRight" className="w-3 h-3 mt-1 shrink-0" />}
    </div>
  );
}

function MetricCell({ label, current, target, status, onClick }) {
  const colors = {
    ok: { fg: 'var(--ok)', bg: '#e8f5ed' },
    warn: { fg: 'var(--warn)', bg: '#fdf6e7' },
    bad: { fg: 'var(--bad)', bg: '#fdecec' },
  };
  const c = colors[status];
  const clickable = !!onClick;
  return (
    <div onClick={onClick} role={clickable ? "button" : undefined} tabIndex={clickable ? 0 : undefined}
      className={`p-4 ${clickable ? "cursor-pointer hover:bg-blue-50/30 transition" : ""}`} style={{borderColor:'var(--border)'}}>
      <div className="flex items-center justify-between">
        <div className="text-[10px] uppercase tracking-widest" style={{color:'var(--ink-faint)'}}>{label}</div>
        {clickable && <Icon name="arrowRight" className="w-3 h-3" />}
      </div>
      <div className="flex items-baseline gap-2 mt-1">
        <div className="text-xl font-semibold tabnum">{current}</div>
        <span className="chip" style={{background: c.bg, color: c.fg, fontSize: 10}}>{status === "ok" ? "On target" : status === "warn" ? "Close" : "Below"}</span>
      </div>
      <div className="text-[11px] mt-1" style={{color:'var(--ink-soft)'}}>Target: {target}</div>
    </div>
  );
}

/* =========================================================
 * ANALYTICS & REPORTS — deeper charts + working CSV export
 * ========================================================= */
function ScreenAnalytics() {
  const calls = useMemo(() => generateCallHistory(), []);
  const [dateRange, setDateRange] = useState("14d");
  const [langFilter, setLangFilter] = useState("all");
  const [intentFilter, setIntentFilter] = useState("all");

  const filteredCalls = useMemo(() => {
    return calls.filter(c => {
      if (langFilter !== "all" && c.language !== langFilter) return false;
      if (intentFilter !== "all" && c.intent !== intentFilter) return false;
      return true;
    });
  }, [calls, langFilter, intentFilter]);

  const daysCount = dateRange === "7d" ? 7 : dateRange === "30d" ? 30 : 14;
  const byDay = useMemo(() => aggregateByDay(filteredCalls, daysCount), [filteredCalls, daysCount]);
  const byIntent = useMemo(() => aggregateByIntent(filteredCalls), [filteredCalls]);
  const byLang = useMemo(() => aggregateByLanguage(filteredCalls), [filteredCalls]);
  const latency = useMemo(() => latencySeries(), []);

  const totalVolume = byDay.reduce((s, d) => s + d.total, 0);
  const totalResolved = byDay.reduce((s, d) => s + d.resolved, 0);
  const totalTransferred = byDay.reduce((s, d) => s + d.transferred, 0);
  const totalCallback = byDay.reduce((s, d) => s + d.callback, 0);
  const overallDeflection = totalVolume ? ((totalResolved / totalVolume) * 100).toFixed(1) : 0;
  const avgAht = byDay.reduce((s, d) => s + d.aht * d.total, 0) / (totalVolume || 1);

  const t = chartTooltipStyle();

  const exportCsv = () => {
    const rows = [
      ["Date", "Total", "Resolved", "Transferred", "Callback", "Abandoned", "Deflection (%)", "AHT (s)"],
      ...byDay.map(d => [d.date, d.total, d.resolved, d.transferred, d.callback, d.abandoned, d.deflection, d.aht])
    ];
    const csv = rows.map(r => r.join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `IFCI_Pension_VoiceBot_Report_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const exportPdf = () => {
    // open a print-friendly window — equivalent to a "save as PDF" prompt
    const w = window.open("", "_blank");
    if (!w) return alert("Pop-up blocked. Allow pop-ups to download the PDF.");
    const rows = byDay.map(d => `<tr><td>${d.date}</td><td>${d.total}</td><td>${d.resolved}</td><td>${d.transferred}</td><td>${d.callback}</td><td>${d.abandoned}</td><td>${d.deflection}%</td><td>${Math.floor(d.aht/60)}m ${d.aht%60}s</td></tr>`).join("");
    w.document.write(`
      <html><head><title>IFCI Pension Voice Bot — Report</title>
      <style>
        body { font-family: -apple-system, sans-serif; padding: 32px; color: #131821; }
        h1 { color: #0f4c81; margin: 0; }
        h2 { color: #5b6472; font-size: 14px; font-weight: 500; margin-top: 4px; }
        .head { border-bottom: 3px solid #c8932f; padding-bottom: 16px; margin-bottom: 24px; }
        .kpi { display: inline-block; padding: 12px 20px; border: 1px solid #e3e6ea; border-radius: 6px; margin-right: 12px; margin-bottom: 12px; }
        .kpi-l { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #8a93a2; }
        .kpi-v { font-size: 22px; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; }
        th, td { padding: 8px 10px; border-bottom: 1px solid #e3e6ea; text-align: left; }
        th { background: #f5f6f8; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #5b6472; }
        .footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #e3e6ea; font-size: 11px; color: #8a93a2; }
      </style></head><body>
      <div class="head">
        <h1>IFCI Pension Voice Bot</h1>
        <h2>Operations Report · ${new Date().toLocaleString("en-IN", {dateStyle:"medium"})} · Range: ${dateRange}</h2>
      </div>
      <div class="kpi"><div class="kpi-l">Total calls</div><div class="kpi-v">${totalVolume.toLocaleString("en-IN")}</div></div>
      <div class="kpi"><div class="kpi-l">Deflection</div><div class="kpi-v">${overallDeflection}%</div></div>
      <div class="kpi"><div class="kpi-l">Transferred</div><div class="kpi-v">${totalTransferred}</div></div>
      <div class="kpi"><div class="kpi-l">Callback</div><div class="kpi-v">${totalCallback}</div></div>
      <h3 style="margin-top: 24px;">Daily breakdown</h3>
      <table><thead><tr><th>Date</th><th>Total</th><th>Resolved</th><th>Transferred</th><th>Callback</th><th>Abandoned</th><th>Deflection</th><th>AHT</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="footer">IFCI Limited · Confidential · Generated by the Voice Bot Operations Console · Stored in India region · DPDP-aligned</div>
      <script>setTimeout(() => window.print(), 400);<\/script>
      </body></html>
    `);
    w.document.close();
  };

  return (
    <div className="px-6 py-5">
      {/* Filter bar */}
      <div className="card p-3 mb-5 flex flex-wrap items-center gap-2">
        <div className="flex gap-1 p-1 rounded border" style={{borderColor:'var(--border)'}}>
          {[["7d","Last 7 days"],["14d","Last 14 days"],["30d","Last 30 days"]].map(([k,l]) => (
            <button key={k} onClick={()=>setDateRange(k)} className={`text-xs px-3 py-1.5 rounded ${dateRange===k?"btn-primary":"btn-ghost"}`}>{l}</button>
          ))}
        </div>
        <select className="input w-auto" value={langFilter} onChange={(e)=>setLangFilter(e.target.value)}>
          <option value="all">All languages</option>
          {LANGS.map(l => <option key={l.code} value={l.code}>{l.english}</option>)}
        </select>
        <select className="input w-auto" value={intentFilter} onChange={(e)=>setIntentFilter(e.target.value)}>
          <option value="all">All intents</option>
          {Object.entries(INTENTS).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
        </select>
        <div className="ml-auto flex gap-2">
          <button onClick={exportCsv} className="text-sm py-2 px-3 rounded font-medium border flex items-center gap-2" style={{borderColor:'var(--border)', color:'var(--ink-soft)'}}>
            <Icon name="file" className="w-4 h-4"/> Export CSV
          </button>
          <button onClick={exportPdf} className="btn-primary text-sm py-2 px-3 rounded font-medium flex items-center gap-2">

          </button>
        </div>
      </div>

      {/* Headline KPIs */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">

        <KpiCard label="Transferred" value={totalTransferred.toLocaleString("en-IN")} sub={`${((totalTransferred/totalVolume)*100).toFixed(1)}% of total`} sparkData={byDay.map(d => ({v: d.transferred}))} sparkColor="var(--warn)"/>
        <KpiCard label="Avg handle time" value={`${Math.floor(avgAht/60)}m ${Math.round(avgAht%60)}s`} sub="bot-resolved queries" sparkData={byDay.map(d => ({v: d.aht}))} sparkColor="var(--accent)"/>
      </div>

      {/* Volume + deflection */}
      <div className="grid grid-cols-12 gap-4 mb-4">
        <div className="col-span-12 lg:col-span-7">
          <ChartCard title="Call volume trend" subtitle="Stacked by outcome" height={280}>
            <AreaChart data={byDay} margin={{top:5,right:8,left:-12,bottom:0}}>
              <defs>
                <linearGradient id="vg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--ok)" stopOpacity={0.5}/><stop offset="100%" stopColor="var(--ok)" stopOpacity={0}/></linearGradient>
                <linearGradient id="vg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--warn)" stopOpacity={0.5}/><stop offset="100%" stopColor="var(--warn)" stopOpacity={0}/></linearGradient>

              <CartesianGrid strokeDasharray="3 3" stroke="#eef0f3" vertical={false}/>
              <XAxis dataKey="date" tick={{fontSize:10, fill:'#8a93a2'}} axisLine={false} tickLine={false}/>

function ReportRow({ name, cadence, recipients, format, last, status }) {
  const colors = { ok: { bg: '#e8f5ed', fg: 'var(--ok)' }, pending: { bg: '#fdf6e7', fg: 'var(--warn)' } };
  const c = colors[status];
  return (
    <tr className="border-t" style={{borderColor:'var(--border)'}}>
      <td className="px-4 py-2.5 text-xs font-medium">{name}</td>
      <td className="px-4 py-2.5 text-xs" style={{color:'var(--ink-soft)'}}>{cadence}</td>
      <td className="px-4 py-2.5 text-xs" style={{color:'var(--ink-soft)'}}>{recipients}</td>
      <td className="px-4 py-2.5 text-xs" style={{color:'var(--ink-soft)'}}>{format}</td>
      <td className="px-4 py-2.5 text-xs tabnum" style={{color:'var(--ink-soft)'}}>{last}</td>
      <td className="px-4 py-2.5 text-center">
        <span className="chip" style={{background: c.bg, color: c.fg}}>
          <span className="chip-dot" style={{background: c.fg}}></span>{status}
        </span>
      </td>
      <td className="px-4 py-2.5 text-right">
        <button className="btn-ghost text-xs px-2 py-1 rounded">Run now</button>
      </td>
    </tr>
  );
}

function ScreenIntents() {
  const [intents, setIntents] = useState(SEED_INTENT_DEFS);
  const [selectedKey, setSelectedKey] = useState("payment_status");
  const [activeLang, setActiveLang] = useState("hi");
  const [editPrompt, setEditPrompt] = useState("");
  const [editing, setEditing] = useState(false);
  const [toast, setToast] = useState(null);

  const intent = intents[selectedKey];
  const intentMeta = INTENTS[selectedKey];

  useEffect(() => {
    setEditPrompt(intent.prompts[activeLang] || "");
    setEditing(false);
  }, [selectedKey, activeLang]);

  const savePrompt = () => {
    setIntents(prev => ({
      ...prev,
      [selectedKey]: {
        ...prev[selectedKey],
        prompts: { ...prev[selectedKey].prompts, [activeLang]: editPrompt },
        version: prev[selectedKey].version + 1,
        lastEditedBy: "Anita Mehra",
        lastEditedAt: "2026-04-23",
      }
    }));
    setEditing(false);
    setToast({ msg: "Prompt saved · queued for native-speaker review", tone: "ok" });

  return (
    <div className="px-6 py-5">
      {toast && (
        <div className="fixed bottom-6 right-6 z-50 fade-up">

  const holidaysOnDate = (iso) => HOLIDAYS_2026.filter(h => h.date === iso && (activeType === "all" || h.type === activeType));

            <div className="p-4">

                  const iso = `${year}-${String(monthNum).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

                      <div className="text-[10px]" style={{color:'var(--ink-faint)'}}>{new Date(h.date).toLocaleDateString("en-IN", {weekday:"short"})}</div>
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <div className="text-sm font-medium">{h.name}</div>
                        <span className="chip" style={{
                          background: h.type === "rbi" ? '#fdecec' : h.type === "lic" ? '#fdf6e7' : 'var(--accent-soft)',
                          color: h.type === "rbi" ? 'var(--bad)' : h.type === "lic" ? 'var(--warn)' : 'var(--accent)'
                        }}>{h.type.toUpperCase()}</span>
                      </div>
                      <div className="text-xs mt-1" style={{color:'var(--ink-soft)'}}>{h.impact}</div>
                    </div>
                    <Icon name="arrowRight" className="w-4 h-4 mt-1 shrink-0" />
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

    { id:"sys_audit", name:"Auto-audit", role:"System", ip:"127.0.0.1" },
  ];
  const actions = [
    { type:"login", entity:"session", verb:"Logged in via Azure AD SSO" },
    { type:"data_access", entity:"pensioner", verb:"Viewed pensioner record P-100214" },
    { type:"data_access", entity:"pensioner", verb:"Viewed pensioner record P-100388" },

    { type:"update", entity:"prompt", verb:"Updated prompt · grievance · English · v3 → v4" },
    { type:"create", entity:"ticket", verb:"Created grievance G-2026-04-7821" },
    { type:"update", entity:"ticket", verb:"Updated ticket G-2026-04-7798 · status open → in_progress" },
    { type:"config_change", entity:"holiday", verb:"Added holiday entry: 22 Apr 2026 · IFCI town hall" },

    { type:"call_session", entity:"call", verb:"Bot session closed · resolved by bot · rating 5" },
    { type:"handover", entity:"call", verb:"Warm transfer to agent AG-04 · context payload sent" },
    { type:"auth_failed", entity:"session", verb:"OTP retry exhausted · 30-min lockout" },
    { type:"delete", entity:"recording", verb:"Recording auto-deleted per 12-month retention" },
    { type:"data_access", entity:"transcript", verb:"DPO viewed transcript for data subject request" },
  ];
  const list = [];
  const now = new Date("2026-04-23T16:45:00");
  for (let i = 0; i < 80; i++) {
    const actor = actors[Math.floor(r() * actors.length)];
    const action = actions[Math.floor(r() * actions.length)];
    const ts = new Date(now.getTime() - Math.floor(r() * 60 * 24 * 5) * 60000);
    list.push({
      id: "AL-" + (980100 + i),
      ts: ts.toISOString(),
      actor: actor.name,
      role: actor.role,
      ip: actor.ip,
      action: action.type,
      entity: action.entity,
      verb: action.verb,
      sessionId: "sess_" + Math.random().toString(36).slice(2, 8),
    });
  }
  return list.sort((a,b) => new Date(b.ts) - new Date(a.ts));
}
