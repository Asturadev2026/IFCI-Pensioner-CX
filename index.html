const TICKET_SLA_HOURS = { high: 24, medium: 72, low: 168 };

function ticketAgeHours(t) {
  const opened = new Date(t.openedAt);
  const end = t.resolvedAt ? new Date(t.resolvedAt) : new Date("2026-04-23T17:00:00");
  return Math.max(0, (end - opened) / 3600000);
}

function ticketSlaState(t) {
  if (t.status === "resolved") return "met";
  const age = ticketAgeHours(t);
  const sla = TICKET_SLA_HOURS[t.severity] || 72;
  if (age > sla) return "breached";
  if (age > sla * 0.75) return "at_risk";
  return "ok";
}

  const nav = useNav();
  const [search, setSearch] = useState("");

  const [view, setView] = useState("all"); // all | open | sla_risk | resolved

  const filtered = useMemo(() => {
    return SEED_TICKETS.filter(t => {
      if (view === "open" && t.status === "resolved") return false;
      if (view === "sla_risk" && (t.status === "resolved" || ticketSlaState(t) === "ok")) return false;
      if (view === "resolved" && t.status !== "resolved") return false;
      if (statusFilter !== "all" && t.status !== statusFilter) return false;
      if (severityFilter !== "all" && t.severity !== severityFilter) return false;
      if (ownerFilter !== "all" && t.owner !== ownerFilter) return false;

                    <div className="text-[9px] uppercase" style={{color:'var(--ink-faint)'}}>Resolved</div>
                    <div className="text-lg font-semibold tabnum" style={{color:'var(--ok)'}}>{resCt}</div>
                  </div>

            { k: "open", l: "Open", n: open.length },
            { k: "sla_risk", l: "SLA risk", n: slaRisk, tone: slaRisk > 0 ? "bad" : null },

          ].map(v => (
            <button key={v.k} onClick={() => setView(v.k)} className={`chip text-xs ${view === v.k ? "btn-primary" : "border"}`} style={{

                const age = ticketAgeHours(tk);
                const slaState = ticketSlaState(tk);
                const sla = TICKET_SLA_HOURS[tk.severity] || 72;
                const slaColors = { ok: 'var(--ok)', at_risk: 'var(--warn)', breached: 'var(--bad)', met: 'var(--ink-soft)' };
                return (
                  <tr key={tk.id} onClick={() => nav.drill("ticket_detail", { id: tk.id })} className="cursor-pointer border-t hover:bg-blue-50/30" style={{borderColor:'var(--border)'}}>

                    <td className="px-4 py-2.5 text-xs">{tk.subject}</td>
                    <td className="px-4 py-2.5">
                      <span className="chip" style={{
                        background: tk.severity === "high" ? '#fdecec' : tk.severity === "medium" ? '#fbf3e0' : '#f0f2f5',
                        color: tk.severity === "high" ? 'var(--bad)' : tk.severity === "medium" ? 'var(--warn)' : 'var(--ink-soft)'
                      }}>{tk.severity}</span>
                    </td>
                    <td className="px-4 py-2.5">
                      <span className="chip border" style={{borderColor:'var(--border)', color:'var(--ink-soft)'}}>{tk.status.replace("_"," ")}</span>
                    </td>
                    <td className="px-4 py-2.5 text-xs">{tk.owner}</td>
                    <td className="px-4 py-2.5">
                      <div className="text-xs tabnum">{age < 24 ? `${age.toFixed(1)}h` : `${(age/24).toFixed(1)}d`} <span style={{color:'var(--ink-faint)'}}>/ {sla < 24 ? sla + "h" : (sla/24) + "d"}</span></div>
                      <span className="chip" style={{
                        background: slaState === "met" ? '#e8f5ed' : slaState === "breached" ? '#fdecec' : slaState === "at_risk" ? '#fdf6e7' : '#e8f5ed',
                        color: slaColors[slaState],
                      }}>{slaState === "met" ? "Met" : slaState === "breached" ? "Breached" : slaState === "at_risk" ? "At risk" : "On track"}</span>
                    </td>
                    <td className="px-4 py-2.5 text-xs" style={{color:'var(--ink-soft)'}}>
                      <div className="truncate max-w-[260px]">{tk.lastNote}</div>
                      <div className="text-[10px] tabnum" style={{color:'var(--ink-faint)'}}>{new Date(tk.openedAt).toLocaleString("en-IN", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"})}</div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        {filtered.length === 0 && (
          <div className="text-center py-12 text-sm" style={{color:'var(--ink-faint)'}}>No tickets match the filters.</div>
        )}
      </div>
    </div>
  );
}

/* =========================================================
 * ROOT APP
 * ========================================================= */
function App() {
  const [user, setUser] = useState(null);
  const [screen, setScreen] = useState("dashboard");
  const [detailStack, setDetailStack] = useState([]); // stack of {topic, params}

  const nav = useMemo(() => ({
    goTo: (key) => { setScreen(key); setDetailStack([]); },
    drill: (topic, params) => setDetailStack(s => [...s, { topic, params }]),
    back: () => setDetailStack(s => s.slice(0, -1)),
    closeDetail: () => setDetailStack([]),
  }), []);

  const currentDetail = detailStack[detailStack.length - 1] || null;

  if (!user) return <Login onAuth={setUser}/>;

  const titleMap = {
    simulator: "Live Call Simulator",
    agent: "Agent Console",
    history: "Call History",
    pensioners: "Active Queue & Callbacks",
    tickets: "Ticket Dashboard",
    dashboard: "Operations Dashboard",
    analytics: "Analytics & Reports",
    intents: "Intents & Prompts",
    holidays: "Holiday Calendar",
    integrations: "Integrations",
    audit: "Audit Trail",
    settings: "Settings",
  };
  const subtitleMap = {
    simulator: "Run a scripted call end-to-end. Watch the pensioner-side experience, the call flow, and the system trace at the same time.",
    agent: "Handle a live handover from the bot. Full pensioner context arrives before you pick up — last 3 calls, open tickets, last payment, masked records.",
    history: "Every call is logged with transcript, recording, intent, sentiment, and outcome. Audit-grade retention applies.",
    pensioners: "Calls waiting for an agent and callbacks scheduled by the bot for the next working day.",
    tickets: "Every grievance opened by the bot or by an agent. SLA-tracked by severity. Click any row for the full timeline.",
    dashboard: "Real-time view of the helpdesk. Click any KPI, chart, attention card, or metric cell to open the detail screen.",
    analytics: "Deeper trends and exports. Filter by date range, language, intent. Reports honour current filters.",
    intents: "Manage the intent taxonomy and bot response prompts across all 6 languages. Versioned with rollback.",
    holidays: "RBI bank holidays, LIC operational windows, and IFCI office closures feed directly into the bot's payment date logic.",
    integrations: "Live health and SLA view across every external system the bot touches. Sub-processors bound by back-to-back data terms.",
    audit: "Immutable, append-only log of every login, data access, config change, and call. 7-year retention.",
    settings: "Users, roles, retention, data subject rights workflow, and bulk export.",
  };

  let body, title, subtitle;
  if (currentDetail) {
    // Show detail view as the body, keep top-bar title pointing to base screen
    body = <DetailView detail={currentDetail} onBack={nav.back}/>;
    title = titleMap[screen];
    subtitle = null; // detail provides its own
  } else {
    title = titleMap[screen];
    subtitle = subtitleMap[screen];
    if (screen === "simulator") body = <ScreenSimulator/>;
    else if (screen === "agent") body = <ScreenAgent/>;
    else if (screen === "history") body = <ScreenHistory/>;
    else if (screen === "pensioners") body = <ScreenQueue/>;
    else if (screen === "tickets") body = <ScreenTickets/>;
    else if (screen === "dashboard") body = <ScreenDashboard/>;
    else if (screen === "analytics") body = <ScreenAnalytics/>;
    else if (screen === "intents") body = <ScreenIntents/>;
    else if (screen === "holidays") body = <ScreenHolidays/>;
    else if (screen === "integrations") body = <ScreenIntegrations/>;
    else if (screen === "audit") body = <ScreenAudit/>;
    else if (screen === "settings") body = <ScreenSettings user={user}/>;
  }

  return (
    <NavContext.Provider value={nav}>
      <AppShell user={user} onLogout={()=>setUser(null)} screen={screen} setScreen={nav.goTo}
                title={title} subtitle={subtitle}>
        {body}
      </AppShell>
    </NavContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
